  --line:#D2DBCF; --accent:#2F6B45; --accent-ink:#FFFFFF;

  --ok-bg:#CFE3D2; --ok-fg:#1C3A27; --warn-bg:#F6DFA8; --warn-fg:#6B4200; --bad-bg:#F3D3D0; --bad-fg:#7A1F1F;
  --bar:#3F7A52; --bar-warn:#B7791F; --trad:#9AA89D; --sky:#2F6F8F;
  --display:'DM Sans',system-ui,Arial,sans-serif; --body:'Public Sans',system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111B15; --surface:#1B2A21; --card:#16241C; --ink:#E9EFE5; --muted:#A5B6AA;
  --line:#2B3E31; --accent:#6FBF8A; --accent-ink:#0E1A12;
  --hero-bg:#0A110D; --hero-fg:#F2F1E4; --hero-mut:#A5B6AA; --hero-hi:#E3A92F; --hero-card:#16241C;
  --ok-bg:#25402F; --ok-fg:#CFE8D6; --warn-bg:#3A2E10; --warn-fg:#F0C469; --bad-bg:#3B1B19; --bad-fg:#F2A9A3;
  --bar:#6FBF8A; --bar-warn:#E3A92F; --trad:#5E7164; --sky:#7CC0DD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B15; --surface:#1B2A21; --card:#16241C; --ink:#E9EFE5; --muted:#A5B6AA;
  --line:#2B3E31; --accent:#6FBF8A; --accent-ink:#0E1A12;
  --hero-bg:#0A110D; --hero-fg:#F2F1E4; --hero-mut:#A5B6AA; --hero-hi:#E3A92F; --hero-card:#16241C;
  --ok-bg:#25402F; --ok-fg:#CFE8D6; --warn-bg:#3A2E10; --warn-fg:#F0C469; --bad-bg:#3B1B19; --bad-fg:#F2A9A3;
  --bar:#6FBF8A; --bar-warn:#E3A92F; --trad:#5E7164; --sky:#7CC0DD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:18px}
h1,h2,h3,p,ul{margin:0}
h1{font-family:var(--display);font-size:30px;line-height:1.15;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;line-height:1.25}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:3px;color:var(--accent);text-decoration:none}
.right{display:flex;gap:8px;align-items:center}
.chip{font-size:13px;font-weight:600;background:var(--surface);padding:6px 12px;border-radius:999px;color:var(--ink);text-decoration:none;white-space:nowrap}
.chip.plan{background:var(--accent);color:var(--accent-ink)}
.sub{color:var(--muted)}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px}
.hero .mut{color:var(--hero-mut);font-size:14px}
.big{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.05;color:var(--hero-hi);font-variant-numeric:tabular-nums}
.hero-row{display:flex;gap:16px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px 6px;min-width:0;text-align:center;color:var(--ink);text-decoration:none;display:block}
.stat b{display:block;font-family:var(--display);font-size:clamp(15px,4.4vw,24px);line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b.nw{white-space:nowrap;overflow-wrap:normal}
.stat b .u{font-size:.62em;font-style:normal;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.box{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.box.flat{background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.none{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.ok{background:var(--ok-bg);color:var(--ok-fg)} .warn{background:var(--warn-bg);color:var(--warn-fg)} .bad{background:var(--bad-bg);color:var(--bad-fg)}
.meter{height:10px;border-radius:999px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--bar);transition:width .6s}
.meter i.w{background:var(--bar-warn)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:10px 16px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button[aria-pressed="true"],.primary{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--hero-hi);outline-offset:2px}
.small{font-size:13px;color:var(--muted)}
.sec{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.wx-now{display:flex;gap:16px;align-items:center}
.wx-now .t{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.wx-now svg{width:64px;height:64px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.facts b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hours div{flex:none;width:58px;background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.hours b{font-size:16px;color:var(--ink)}
.hours svg,.day svg{width:26px;height:26px}
.day{display:grid;grid-template-columns:44px 30px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px}
.day b{font-variant-numeric:tabular-nums}
.day .rain{font-size:13px;color:var(--sky);font-weight:600}
.lock{position:relative;border:2px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.plan{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:16px 18px;border:2px solid transparent;cursor:pointer}
.plan:has(input:checked){border-color:var(--accent)}
.plan input{margin-top:5px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.plan .price{font-family:var(--display);font-weight:700;font-size:21px;color:var(--accent);white-space:nowrap}
.plan ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:340px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--display)} th.cur{color:var(--accent)}
td .y{color:var(--accent);font-weight:700} td .n{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input[type=text],select{font:inherit;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.alert{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.alert.hot{border:2px solid var(--bar-warn)}
.alert.read{opacity:.7}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.sw button{min-width:76px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
nav div{max-width:480px;margin:0 auto;display:flex}
nav a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
nav a[aria-current="page"]{color:var(--accent)}
nav a .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bar-warn);color:#1C2B21;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

</head>

 return h;}
